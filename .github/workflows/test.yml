name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Validate registry
        run: python scripts/clinical_calculator.py validate
      - name: Generate input contract coverage report
        run: python scripts/report_contract_coverage.py
      - name: Evaluate routing quality
        run: python scripts/evaluate_routing.py
      - name: Evaluate held-out routing quality
        run: >-
          python scripts/evaluate_routing.py
          --cases evaluation/routing_cases_heldout.csv
          --report reports/routing_evaluation_heldout.json
      - name: Run tests
        run: python -m pytest -q
