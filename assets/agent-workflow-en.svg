    <circle cx="25" cy="21" r="7" fill="#159A87"/>
    <path d="M22 21L25 24L30 18" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="43" y="27" fill="#225049" font-family="'Avenir Next', 'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">When context is unclear, the Agent stops and asks—it never fills gaps from memory.</text>
  </g>
