  <text x="64" y="68" fill="#8FD9CC" font-family="'Avenir Next', 'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" letter-spacing="2.4">ONE RELIABLE WORKFLOW</text>
  <text x="64" y="106" fill="#F4FAF8" font-family="'Avenir Next', 'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="700">Evidence you can verify at every step</text>

  <path d="M285 231H348M600 231H663M915 231H978" stroke="#75CFC0" stroke-opacity="0.48" stroke-width="2" stroke-dasharray="4 8"/>
  <path d="M340 224L348 231L340 238M655 224L663 231L655 238M970 224L978 231L970 238" stroke="#75CFC0" stroke-opacity="0.72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(55 142)" filter="url(#flowShadowEn)">
    <rect x="-5" y="-5" width="240" height="190" rx="24" fill="#17343C" stroke="#73CABA" stroke-opacity="0.2"/>
    <rect width="230" height="180" rx="19" fill="#123039"/>
    <rect x="20" y="20" width="42" height="28" rx="14" fill="#D7F5EF"/>
    <text x="34" y="39" fill="#116B5D" font-family="'Avenir Next', 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800">01</text>
    <text x="20" y="84" fill="#F4FAF8" font-family="'Avenir Next', 'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700">Describe the question</text>
    <text x="20" y="114" fill="#9DB8BA" font-family="'Avenir Next', 'Plus Jakarta Sans', sans-serif" font-size="12">Use natural language.</text>
    <text x="20" y="137" fill="#9DB8BA" font-family="'Avenir Next', 'Plus Jakarta Sans', sans-serif" font-size="12">No exact name or ID needed.</text>
  </g>

  <g transform="translate(370 142)" filter="url(#flowShadowEn)">
    <rect x="-5" y="-5" width="240" height="190" rx="24" fill="#17343C" stroke="#73CABA" stroke-opacity="0.2"/>
    <rect width="230" height="180" rx="19" fill="#123039"/>
    <rect x="20" y="20" width="42" height="28" rx="14" fill="#D7F5EF"/>
    <text x="34" y="39" fill="#116B5D" font-family="'Avenir Next', 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800">02</text>
    <text x="20" y="84" fill="#F4FAF8" font-family="'Avenir Next', 'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700">Match the right tool</text>
    <text x="20" y="114" fill="#9DB8BA" font-family="'Avenir Next', 'Plus Jakarta Sans', sans-serif" font-size="12">Check name, version,</text>
    <text x="20" y="137" fill="#9DB8BA" font-family="'Avenir Next', 'Plus Jakarta Sans', sans-serif" font-size="12">population, and readiness.</text>
  </g>

  <g transform="translate(685 142)" filter="url(#flowShadowEn)">
    <rect x="-5" y="-5" width="240" height="190" rx="24" fill="#17343C" stroke="#73CABA" stroke-opacity="0.2"/>
    <rect width="230" height="180" rx="19" fill="#123039"/>
    <rect x="20" y="20" width="42" height="28" rx="14" fill="#D7F5EF"/>
    <text x="34" y="39" fill="#116B5D" font-family="'Avenir Next', 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800">03</text>
    <text x="20" y="84" fill="#F4FAF8" font-family="'Avenir Next', 'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700">Clarify key inputs</text>
    <text x="20" y="114" fill="#9DB8BA" font-family="'Avenir Next', 'Plus Jakarta Sans', sans-serif" font-size="12">Ask only for missing values,</text>
    <text x="20" y="137" fill="#9DB8BA" font-family="'Avenir Next', 'Plus Jakarta Sans', sans-serif" font-size="12">units, timing, and history.</text>
  </g>

  <g transform="translate(1000 142)" filter="url(#flowShadowEn)">
    <rect x="-5" y="-5" width="240" height="190" rx="24" fill="#17343C" stroke="#73CABA" stroke-opacity="0.2"/>
    <rect width="230" height="180" rx="19" fill="#123039"/>
    <rect x="20" y="20" width="42" height="28" rx="14" fill="#D7F5EF"/>
    <text x="34" y="39" fill="#116B5D" font-family="'Avenir Next', 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800">04</text>
    <text x="20" y="84" fill="#F4FAF8" font-family="'Avenir Next', 'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700">Calculate &amp; explain</text>
    <text x="20" y="114" fill="#9DB8BA" font-family="'Avenir Next', 'Plus Jakarta Sans', sans-serif" font-size="12">Return the result, source,</text>
    <text x="20" y="137" fill="#9DB8BA" font-family="'Avenir Next', 'Plus Jakarta Sans', sans-serif" font-size="12">review state, and limits.</text>
  </g>

  <g transform="translate(265 362)">
