<svg width="1280" height="440" viewBox="0 0 1280 440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="flowGlowEn" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1110 50) rotate(144) scale(510 660)">
      <stop stop-color="#35BFA8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#35BFA8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="flowGridEn" width="32" height="32" patternUnits="userSpaceOnUse">
